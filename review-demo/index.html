
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revenue Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      padding: 40px;
      color: #172033;
    }
    .container {
      max-width: 500px;
      margin: 60px auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px #00000012;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
    }
    input { border: 1px solid #ddd; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }
    .result {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Revenue Calculator</h1>
    <p>Estimate your monthly subscription revenue.</p>

    <label for="customers">Number of customers</label>
    <input id="customers" type="number" value="100">

    <label for="price">Monthly price ($)</label>
    <input id="price" type="number" value="20">

    <label for="discount">Discount (%)</label>
    <input id="discount" type="number" value="10">

    <button onclick="calculateRevenue()">
      Calculate Revenue
    </button>

    <div class="result" id="result" aria-live="polite">
      Monthly Revenue: $0
    </div>
  </main>

  <script>
    function calculateRevenue() {
      const customers =
        Number(document.getElementById("customers").value);

      const price =
        Number(document.getElementById("price").value);

      const discount =
        Number(document.getElementById("discount").value);

      const revenue = customers * price;
      const discountedRevenue =
        revenue - (revenue * discount / 100);

      document.getElementById("result").innerText =
        "Monthly Revenue: $" + discountedRevenue.toFixed(2);
    }
  </script>
</body>
</html>
